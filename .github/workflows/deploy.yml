name: Upload to Steam Workshop

on:
  release:
    types: [published]

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main

      - name: Setup SteamCMD
        uses: andriivitiv/setup-steamcmd@v1

      - name: Setup SteamCMD config.vdf
        env:
          STEAM_CONFIG_VDF: ${{ secrets.STEAM_CONFIG_VDF }}
        run: >
          echo "$STEAM_CONFIG_VDF" | base64 -d > ~/Steam/config/config.vdf

      - name: Config mod/modinfo.lua
        run: sed -i "s/0.0.0/$GITHUB_REF_NAME/" mod/modinfo.lua

      - name: Generate workshop.vdf
        env:
          ITEM_ID: ${{ vars.ITEM_ID }}
        run: |
          cat <<EOF > $GITHUB_WORKSPACE/workshop.vdf
          "workshopitem"
          {
            "appid"             "322330"
            "publishedfileid"   "$ITEM_ID" // 0 创建新项目
            "contentfolder"     "$GITHUB_WORKSPACE/mod"
            "changenote"        "${{ github.event.release.body }}"
          }
          EOF

      - name: Upload Item to Workshop
        env:
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          STEAM_PASSWORD: ${{ secrets.STEAM_PASSWORD }}
        run: >
          steamcmd
          +login "$STEAM_USERNAME" "$STEAM_PASSWORD"
          +workshop_build_item "$GITHUB_WORKSPACE/workshop.vdf"
          +quit